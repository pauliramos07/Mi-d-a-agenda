<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6e9e5"><title>MI DÍA</title>
<style>
:root{--bg:#fbf7f3;--paper:#fffdfa;--ink:#403b38;--muted:#918781;--pink:#d98f91;--sage:#a9b8a5;--sagebg:#e8eee5;--line:#eee5df}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 15px 28px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 3px 15px}.brand{font:29px Georgia,serif;letter-spacing:2px;color:#b9787b}.sub{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:4px}.muted{color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:16px;margin:10px 0;box-shadow:0 8px 24px #70594b10}.monthbar,.datehead{display:flex;align-items:center;justify-content:space-between}.monthbar{margin-bottom:12px}.monthbar strong{font:19px Georgia,serif;text-transform:capitalize}.icon{border:0;border-radius:10px;background:var(--bg);width:36px;height:36px;font-size:20px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week span{font-size:10px;color:var(--muted);padding:5px}.day{position:relative;border:0;background:transparent;border-radius:11px;min-height:40px;font-size:13px;color:var(--ink)}.day.other{color:#c9c0ba}.day.sel{background:var(--pink);color:white;font-weight:700}.day.now:not(.sel){outline:1px solid var(--pink)}.dot{position:absolute;bottom:4px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--sage)}.sel .dot{background:white}.datehead h2{font:21px Georgia,serif;text-transform:capitalize;margin:0}.tabs{display:flex;gap:7px;margin:14px 0}.tab{flex:1;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 4px;color:var(--muted);font-size:12px}.tab.active{background:var(--sagebg);color:#566651}.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.task:last-child{border:0}.check{width:22px;height:22px;border:1px solid #c9bdb5;border-radius:7px;background:white;flex:none}.check.done{background:var(--sage);color:white;border-color:var(--sage)}.taskbody{flex:1}.task.done .tasktitle{text-decoration:line-through;color:#aaa}.tasktitle{font-size:14px}.meta{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}.pill{border-radius:15px;padding:3px 8px;background:#f4dedd;color:#98676a}.pill.work{background:var(--sagebg);color:#62745e}.del{border:0;background:none;color:#b8aaa2;font-size:18px}.empty{text-align:center;padding:24px 5px;color:var(--muted);font-size:13px}.addtitle{font:19px Georgia,serif;margin:0 0 12px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font:14px -apple-system,sans-serif;color:var(--ink)}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.add{width:100%;padding:13px;margin-top:10px;border:0;border-radius:13px;background:var(--pink);color:white;font-weight:600}.note{font-size:10px;line-height:1.5;color:var(--muted);text-align:center;margin:15px 8px}
</style></head><body><main>
<header class="top"><div><div class="brand">MI DÍA</div><div class="sub">UN LUGAR PARA ORGANIZARTE</div></div><div class="muted" id="today"></div></header>
<section class="panel"><div class="monthbar"><button class="icon" id="prev">‹</button><strong id="month"></strong><button class="icon" id="next">›</button></div><div class="week"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span></div><div class="days" id="days"></div></section>
<section class="panel"><div class="datehead"><h2 id="dateTitle"></h2><small class="muted" id="pending"></small></div><div class="tabs"><button class="tab active" data-filter="all">Todas</button><button class="tab" data-filter="pending">Pendientes</button><button class="tab" data-filter="done">Realizadas</button></div><div id="list"></div></section>
<section class="panel"><h3 class="addtitle">Sumar algo a tu día</h3><form id="form"><input class="field" id="task" placeholder="¿Qué tenés que hacer?" maxlength="100" required><div class="formrow"><input class="field" id="time" type="time"><select class="field" id="cat"><option>Personal</option><option>Familia</option><option>Equilibrio</option><option>Trámites</option></select></div><input class="field" id="detail" placeholder="Nota (opcional)" maxlength="180" style="margin-top:9px"><button class="add">＋ Agregar tarea</button></form></section>
<p class="note">Las tareas se guardan en este navegador y dispositivo. Esta versión no sincroniza con otros dispositivos ni envía notificaciones.</p></main>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,date=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},today=new Date();let selected=key(today),month=new Date(today.getFullYear(),today.getMonth(),1),filter='all',tasks=[];try{tasks=JSON.parse(localStorage.getItem('miDia')||'[]')}catch(e){}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('miDia',JSON.stringify(tasks))}
function drawDays(){ $('#month').textContent=month.toLocaleDateString('es-AR',{month:'long',year:'numeric'});let first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));let out='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=key(d),c='day';if(d.getMonth()!=month.getMonth())c+=' other';if(k===selected)c+=' sel';if(k===key(today))c+=' now';out+=`<button class="${c}" data-date="${k}">${d.getDate()}${tasks.some(t=>t.date===k)?'<i class="dot"></i>':''}</button>`}$('#days').innerHTML=out}
function drawList(){let d=date(selected),all=tasks.filter(t=>t.date===selected),items=all.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('#dateTitle').textContent=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});let n=all.filter(t=>!t.done).length;$('#pending').textContent=n+' pendiente'+(n===1?'':'s');$('#list').innerHTML=items.length?items.map(t=>`<div class="task ${t.done?'done':''}"><button class="check ${t.done?'done':''}" data-toggle="${t.id}">${t.done?'✓':''}</button><div class="taskbody"><div class="tasktitle">${safe(t.title)}</div><div class="meta">${t.time?'◷ '+t.time:''}<span class="pill ${t.cat==='Equilibrio'?'work':''}">${safe(t.cat)}</span>${t.detail?'<span>'+safe(t.detail)+'</span>':''}</div></div><button class="del" data-del="${t.id}">×</button></div>`).join(''):'<div class="empty">No hay tareas para este día 🌿<br>Agregá algo para organizarte.</div>'}
function render(){drawDays();drawList()}$('#days').addEventListener('click',e=>{let b=e.target.closest('[data-date]');if(!b)return;selected=b.dataset.date;let d=date(selected);month=new Date(d.getFullYear(),d.getMonth(),1);render()});$('#prev').onclick=()=>{month.setMonth(month.getMonth()-1);drawDays()};$('#next').onclick=()=>{month.setMonth(month.getMonth()+1);drawDays()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));drawList()});$('#list').addEventListener('click',e=>{let b=e.target.closest('[data-toggle]'),x=e.target.closest('[data-del]');if(b){let t=tasks.find(t=>t.id===b.dataset.toggle);if(t)t.done=!t.done}if(x)tasks=tasks.filter(t=>t.id!==x.dataset.del);save();render()});$('#form').onsubmit=e=>{e.preventDefault();let title=$('#task').value.trim();if(!title)return;tasks.push({id:String(Date.now()),date:selected,title,time:$('#time').value,cat:$('#cat').value,detail:$('#detail').value.trim(),done:false});save();e.target.reset();render()};$('#today').textContent=today.toLocaleDateString('es-AR',{day:'numeric',month:'short'});render();
</script></body></html>
